# Chapter 11. The same as deployment-resources.yaml, without "replicas".
# The HorizontalPodAutoscaler decides how many Botleys there are.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: botley
spec:
  selector:
    matchLabels:
      app: botley
  template:
    metadata:
      labels:
        app: botley
    spec:
      containers:
      - name: botley
        image: botley:2.0
        ports:
        - containerPort: 8080
        resources:
          requests:                  # ← what the scheduler sets aside for each pod
            cpu: 250m
            memory: 128Mi
          limits:                    # ← the most each pod may use
            memory: 256Mi
        readinessProbe:              # ← "only send me traffic when this works"
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 2
        env:
        - name: STARTUP_SECONDS      # ← version 2 takes about 10 seconds to start
          value: "10"
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: botley-settings
              key: GREETING
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: botley-secrets
              key: MODEL_API_KEY
