# Chapter 11. Keep Botley's CPU use near half of what each pod requests,
# by adding or removing Botleys. Never fewer than 2, never more than 8.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: botley
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: botley
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
