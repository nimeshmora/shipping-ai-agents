# Chapter 9. Send 9 in every 10 requests to the usual Botley,
# and 1 in 10 to the one with the new greeting.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: botley
spec:
  parentRefs:
  - name: botley-gateway
  hostnames:
  - botley.example.com
  rules:
  - backendRefs:
    - name: botley
      port: 80
      weight: 90
    - name: botley-friendly
      port: 80
      weight: 10
