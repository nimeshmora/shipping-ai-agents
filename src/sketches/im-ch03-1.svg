<svg viewBox='0 0 680 240'><defs><marker id='a31' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10' fill='none' stroke='#23406e' stroke-width='2'/></marker></defs><g transform='translate(110,110) scale(0.95)' stroke='#1b1b1b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M-28 78 q0 -46 28 -46 q28 0 28 46z' fill='#fff'/><circle cx='0' cy='0' r='20' fill='#fff'/><path d='M-16 -14 q-12 -16 4 -20 q4 -14 16 -6 q12 -8 16 6 q14 4 2 20z' fill='#fff'/><circle cx='-7' cy='0' r='2' fill='#1b1b1b'/><circle cx='7' cy='0' r='2' fill='#1b1b1b'/><path d='M-7 8 q7 6 14 0' fill='none'/></g><g stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'><rect x='190' y='60' width='150' height='120' rx='6' fill='#fff1a6'/><path d='M206 92 h110 M206 112 h96 M206 132 h104 M206 152 h88' fill='none' stroke-width='1.4'/><rect x='198' y='104' width='130' height='16' rx='3' fill='none' stroke='#c62828' stroke-width='2'/><circle cx='590' cy='92' r='38' fill='#fff'/><path d='M590 64 v28 l18 10' fill='none'/></g><text class='hb' x='265' y='82' text-anchor='middle' font-size='13'>the program</text><text class='hk' x='400' y='96' font-size='14'>1. fetch the next step</text><text class='hk' x='400' y='126' font-size='14'>2. do it</text><text class='hk' x='400' y='156' font-size='14'>3. move on</text><path d='M392 142 q-26 -24 0 -48' fill='none' stroke='#23406e' stroke-width='2' marker-end='url(#a31)'/><text class='h' x='590' y='150' text-anchor='middle' font-size='12.5'>the clock:</text><text class='h' x='590' y='166' text-anchor='middle' font-size='12.5'>billions of ticks</text><text class='h' x='590' y='182' text-anchor='middle' font-size='12.5'>every second</text><text class='h' x='340' y='222' text-anchor='middle' font-size='14'>A CPU core repeats this loop billions of times a second.</text></svg>