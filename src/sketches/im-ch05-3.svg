<svg viewBox='0 0 680 240'><rect x='40' y='60' width='160' height='110' rx='10' fill='#fff1a6' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/><text class='hb' x='120' y='100' text-anchor='middle' font-size='15'>1 token</text><text class='h' x='120' y='126' text-anchor='middle' font-size='13'>from an 8B model</text><text class='m' x='240' y='125' text-anchor='middle' font-size='30'>=</text><rect x='280' y='50' width='360' height='130' rx='10' fill='#fff' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/><text class='m' x='460' y='112' text-anchor='middle' font-size='30'>8,000,000,000</text><text class='hb' x='460' y='148' text-anchor='middle' font-size='15'>multiply-and-adds</text><text class='h' x='340' y='222' text-anchor='middle' font-size='14'>Roughly one multiply-and-add for every weight in the model, for every single token.</text></svg>