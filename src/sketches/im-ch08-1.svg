'/><text class='hb' x='202' y='193' text-anchor='middle' font-size='12'>GPU 5</text><rect x='250' y='166' width='64' height='44' rx='6' fill='#dcf5d6' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/><text class='hb' x='282' y='193' text-anchor='middle' font-size='12'>GPU 6</text><rect x='370' y='166' width='64' height='44' rx='6' fill='#dcf5d6' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/><text class='hb' x='402' y='193' text-anchor='middle' font-size='12'>GPU 7</text><rect x='450' y='166' width='64' height='44' rx='6' fill='#dcf5d6' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/><text class='hb' x='482' y='193' text-anchor='middle' font-size='12'>GPU 8</text><text class='h' x='600' y='110' text-anchor='middle' font-size='12.5'>any GPU can</text><text class='h' x='600' y='126' text-anchor='middle' font-size='12.5'>talk to any other</text><text class='h' x='600' y='142' text-anchor='middle' font-size='12.5'>at full speed</text><text class='hb' x='70' y='130' text-anchor='middle' font-size='13'>one server</text><text class='h' x='340' y='252' text-anchor='middle' font-size='13'>NVLink: about 900 GB/s per GPU on H100, 1.8 TB/s on Blackwell. PCIe Gen5: about 128 GB/s.</text></svg>