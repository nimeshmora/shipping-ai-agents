<svg viewBox='0 0 680 330'><defs><marker id='kb91' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10' fill='none' stroke='#23406e' stroke-width='2'/></marker><marker id='kb91r' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10' fill='none' stroke='#c62828' stroke-width='2'/></marker></defs><rect x='228' y='8' width='184' height='44' rx='8' fill='#f5f6f3' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round'/><text class='hb' x='320' y='27' font-size='12' text-anchor='middle'>envoy-gateway</text><text class='h' x='320' y='43' font-size='10' text-anchor='middle'>the controller</text><path d='M320 54 V82' fill='none' stroke='#23406e' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#kb91)'/><text class='h' x='212' y='22' font-size='10' text-anchor='end'>reads your Gateway</text><text class='h' x='212' y='36' font-size='10' text-anchor='end'>and HTTPRoute, and</text><text class='h' x='212' y='50' font-size='10' text-anchor='end'>sets up the proxy</text><rect x='220' y='86' width='200' height='160' rx='8' fill='#fff' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round'/><text class='hb' x='320' y='108' font-size='13' text-anchor='middle'>Envoy proxy</text><text class='h' x='320' y='125' font-size='10' text-anchor='middle'>(made for your Gateway)</text><g transform='rotate(-2 320 185)'><rect x='234' y='140' width='172' height='92' rx='3' fill='#fff1a6' stroke='#1b1b1b' stroke-width='2.4' stroke-linejoin='round'/><text class='hb' x='320' y='160' font-size='12' text-anchor='middle'>HTTPRoute: botley</text><text class='hk' x='320' y='180' font-size='11' text-anchor='middle'>name botley.example.com</text><text class='hk' x='320' y='198' font-size='11' text-anchor='middle'>goes to the pods of</text><text class='hk' x='320' y='216' font-size='11' text-anchor='middle'>Service botley</text></g><rect x='10' y='104' width='170' height='78' rx